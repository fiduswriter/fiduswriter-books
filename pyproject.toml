[build-system]
requires = ["setuptools>=82.0.1", "babel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiduswriter-books"
description = "A Fidus Writer plugin to allow creation of books and article collections"
version = "5.0.0-alpha"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
  {email = "johannes@fiduswriter.org", name = "Johannes Wilm"},
]
classifiers=[
  "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
repository = "https://www.github.com/fiduswriter/fiduswriter-books"
